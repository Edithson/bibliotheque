<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>La Bibliothèque des Mots</title>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=Cormorant+Garamond:ital,wght@0,500;0,700;1,500&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script>
<script>tailwind.config={theme:{extend:{fontFamily:{cinzel:['Cinzel','Georgia','serif'],garamond:['Cormorant Garamond','Georgia','serif']}}}}</script>
<style>
:root{--glow:1;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--glow:.6}}
:root[data-theme=dark]{--glow:.6}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;min-height:100vh;color:#f3e7cc;font-family:'Cormorant Garamond',Georgia,serif;background:repeating-linear-gradient(90deg,#2c1b10 0 3px,#341f11 3px 8px,#2a190e 8px 13px),#2a190e}
body::before{content:"";position:fixed;inset:0;pointer-events:none;background:radial-gradient(circle at 50% -10%,rgb(255 200 110 / calc(.3*var(--glow))),transparent 55%),radial-gradient(ellipse at center,transparent 45%,rgb(0 0 0 / .7))}
#lamp{position:fixed;inset:0;pointer-events:none;background:radial-gradient(circle 320px at var(--mx,50%) var(--my,15%),rgb(255 210 130/.22),transparent 68%)}
main,header{position:relative}
:focus-visible{outline:2px solid #f3d98b;outline-offset:3px}
.plate{background:linear-gradient(135deg,#f3d98b,#b98a2e 50%,#8a6420);color:#2a190e;font-family:'Cormorant Garamond',Georgia,serif;font-weight:700;border:1px solid #6b4a12;border-radius:3px;box-shadow:0 2px 4px #000a,inset 0 1px 0 #fff8;cursor:pointer}
.plate[aria-pressed=true]{filter:brightness(1.18) saturate(1.3);box-shadow:inset 0 2px 4px #0006}
.card{background:linear-gradient(90deg,transparent 46px,#c0392b66 46px 48px,transparent 48px),repeating-linear-gradient(#f5ead0 0 27px,#9ab8c988 27px 28px);box-shadow:0 8px 20px #000a;color:#3b2a1a;transform:rotate(-.5deg)}
.shelf{display:flex;align-items:flex-end;gap:3px;padding:30px 18px 0;min-height:260px;background:linear-gradient(#150c06,#26160c);box-shadow:inset 0 22px 40px #000d,inset 0 0 0 4px #4a2c17;overflow-x:auto;overflow-y:hidden;scrollbar-width:thin}
.plank{height:20px;margin:0 -10px;background:linear-gradient(#a06a3b,#6b4223 60%,#3f2412);box-shadow:0 12px 18px #000a,inset 0 2px 0 #c8925a}
.rail{position:absolute;top:4px;left:14px;right:14px;height:5px;border-radius:3px;background:linear-gradient(#d8d8d8,#8a8a8a 55%,#555);box-shadow:0 1px 2px #0008,inset 0 1px 0 #fff8;z-index:6}
.ladder-wrap{position:absolute;top:2px;bottom:2px;width:44px;padding:0;border:0;background:none;cursor:grab;touch-action:pan-y;filter:drop-shadow(3px 6px 5px rgb(0 0 0/.5));transition:left .4s cubic-bezier(.3,1,.4,1),transform .3s ease-out;z-index:7}
.ladder-wrap:active{cursor:grabbing}
.ladder-wrap svg{width:100%;height:100%;display:block}
.spine{position:relative;flex:none;width:var(--w);height:var(--h);display:flex;align-items:center;justify-content:center;border:0;padding:0;color:#e9c96b;cursor:pointer;background:linear-gradient(90deg,rgb(0 0 0 / .45),rgb(255 255 255 / .12) 18%,transparent 45%,rgb(0 0 0 / .4)),var(--c);border-radius:3px 3px 0 0;box-shadow:2px 0 4px #000a;transform-origin:bottom center;transition:transform .35s cubic-bezier(.3,1.5,.5,1),opacity .3s,filter .3s}
.spine:hover,.spine:focus-visible{transform:translateY(-18px) rotate(-1.5deg)}
.spine::before,.spine::after{content:"";position:absolute;left:0;right:0;height:7px;border-block:1.5px solid #e9c96b99}
.spine::before{top:14px}.spine::after{bottom:14px}
.spine span{writing-mode:vertical-rl;transform:rotate(180deg);font:700 13px/1 Cinzel,Georgia,serif;letter-spacing:.06em;text-shadow:0 1px 1px #000;max-height:calc(var(--h) - 70px);overflow:hidden;white-space:nowrap}
.dim{opacity:.2;filter:grayscale(.8)}
.paper{background:linear-gradient(90deg,#e6d5ac,#f6ecd2 7%,#f6ecd2 93%,#e2d0a6)}
@media(min-width:768px){.paper::after{content:"";position:absolute;left:50%;top:0;bottom:0;width:70px;transform:translateX(-50%);background:linear-gradient(90deg,transparent,rgb(60 35 10 / .3),transparent);pointer-events:none}}
@keyframes flip{50%{transform:perspective(1200px) rotateY(-90deg);filter:brightness(.7)}}
@keyframes stamp{30%{transform:scale(1.22) rotate(-8deg)}60%{transform:scale(.95) rotate(2deg)}100%{transform:scale(1)}}
.flip{animation:flip .45s ease-in-out;transform-origin:left center}
.stamp{animation:stamp .4s ease-out}
#t{opacity:0;transform:translate(-50%,12px);transition:.3s;pointer-events:none}
#t.on{opacity:1;transform:translate(-50%,0)}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div id="lamp" aria-hidden="true"></div>
<button id="cart" class="plate fixed right-3 z-40 px-3 py-1.5 text-lg" style="top:calc(.75rem + env(safe-area-inset-top,0px))">Comptoir : <b id="n">0</b></button>

<header class="px-4 pb-2 pt-16 text-center sm:pt-10">
  <div class="plate mx-auto inline-block px-6 py-4 !cursor-default sm:px-12">
    <h1 class="font-cinzel text-2xl font-bold tracking-widest sm:text-4xl">La Bibliothèque des Mots</h1>
  </div>
  <p class="mt-4 font-garamond text-xl italic text-[#e9c96b]/90 sm:text-2xl">Poussez la porte, parcourez les rayons, feuilletez avant d'emporter.</p>
</header>

<main class="mx-auto max-w-4xl px-4 pb-16 sm:px-6">
  <label class="card mt-6 block rounded-sm py-4 pl-[60px] pr-4">
    <span class="font-cinzel text-xs text-[#8b1e1e]">Fiche de recherche</span>
    <input id="q" type="search" placeholder="Un titre, un auteur, un thème…" autocomplete="off" class="mt-1 block w-full bg-transparent font-mono text-lg outline-none placeholder:text-[#3b2a1a]/50">
  </label>
  <div id="cats" class="mt-5 flex flex-wrap justify-center gap-2"></div>
  <p id="ct" class="mt-4 text-center font-garamond text-lg italic text-[#e9c96b]/80"></p>
  <p class="text-center font-garamond text-sm italic text-[#e9c96b]/60 sm:hidden">Faites glisser un rayon pour le parcourir.</p>
  <div id="rows" class="mt-4 space-y-10"></div>
</main>

<div id="m" class="fixed inset-0 z-50 hidden overflow-y-auto bg-black/80 p-3 backdrop-blur-sm sm:p-6" role="dialog" aria-modal="true" aria-labelledby="bt">
  <div id="bk" class="relative m-auto w-full max-w-4xl rounded-md p-2.5 shadow-2xl sm:p-3.5" style="background:linear-gradient(90deg,#0006,transparent 6%,transparent 94%,#0006),var(--c)">
    <div class="paper relative grid overflow-hidden rounded-sm md:grid-cols-2">
      <section class="relative flex flex-col p-6 text-[#3b2a1a] sm:p-9">
        <p id="bg" class="font-garamond text-lg font-bold italic text-[#8b1e1e]"></p>
        <h2 id="bt" class="mt-1 font-cinzel text-2xl font-bold leading-tight text-[#2a190e] sm:text-3xl"></h2>
        <p id="ba" class="mt-1 font-garamond text-xl italic text-[#5a4028]"></p>
        <p class="my-4 text-center text-2xl text-[#b98a2e]" aria-hidden="true">❦</p>
        <p id="bd" class="font-garamond text-xl leading-snug"></p>
        <div class="mt-auto pt-6">
          <p class="font-cinzel text-3xl text-[#2a190e]"><span id="bp"></span> <small class="text-sm">FCFA</small></p>
          <div class="mt-3 flex flex-wrap items-center gap-4">
            <button id="add" class="plate px-5 py-2 text-xl">Poser sur le comptoir</button>
            <button id="x" class="font-garamond text-lg italic underline">Reposer le livre</button>
          </div>
        </div>
        <div aria-hidden="true" class="pointer-events-none absolute bottom-3 right-3 hidden h-16 w-16 -rotate-12 rounded-full border-2 border-[#8b1e1e]/50 text-center font-cinzel text-[8px] font-bold leading-tight text-[#8b1e1e]/60 sm:flex sm:items-center sm:justify-center">EX-LIBRIS<br>BIBLIOTHÈQUE<br>DES MOTS</div>
      </section>
      <section id="rp" class="flex flex-col border-t border-[#0002] p-6 text-[#2f2114] sm:p-9 md:border-l md:border-t-0">
        <p class="font-garamond text-lg font-bold italic text-[#8b1e1e]">Extrait</p>
        <p id="tx" class="mt-3 font-garamond text-xl leading-relaxed first-letter:float-left first-letter:mr-2 first-letter:font-cinzel first-letter:text-6xl first-letter:leading-[.85] first-letter:text-[#8b1e1e] sm:text-2xl"></p>
        <p id="en" hidden class="mt-4 font-garamond text-lg italic text-[#5a4028]">La suite vous attend entre les pages du livre.</p>
        <div class="mt-auto flex items-center justify-between gap-2 pt-6 font-garamond text-lg">
          <button id="pv" class="disabled:opacity-30">‹ Précédente</button>
          <span id="pn" class="text-base"></span>
          <button id="nx" class="disabled:opacity-30">Suivante ›</button>
        </div>
      </section>
    </div>
  </div>
</div>

<div id="t" role="status" class="plate fixed left-1/2 z-[60] max-w-[92vw] px-5 py-2 text-center text-lg" style="bottom:calc(1.5rem + env(safe-area-inset-bottom,0px))"></div>

<script>
/* Catalogue de démonstration (titres et extraits fictifs) — pages d'extrait séparées par | */
const B=[
{t:"Le Cartographe des Brumes",a:"Élise Marchand",g:"Roman",c:"#5b1a1f",w:56,h:216,p:6500,d:"Un géomètre dessine la carte d'une île qui change de place chaque matin.",x:"Le géomètre posa son compas sur la table et sut, avant même de tracer le premier trait, que l'île ne figurerait sur aucune carte.|Chaque matin, la brume déplaçait la côte d'une lieue, et chaque soir il corrigeait ses relevés en riant tout seul."},
{t:"Nuits d'Harmattan",a:"Awa Diallo",g:"Roman",c:"#3e2a1c",w:48,h:196,p:5000,d:"Quand le vent sec se lève, une ville entière rouvre ses souvenirs.",x:"Quand l'harmattan se leva, la ville ferma ses volets et rouvrit ses souvenirs. Chez Mama Awa, on racontait les vieilles histoires.|La poussière rougeoyait sur les toits. Les conteurs ne craignaient pas le vent : il ne faisait qu'apporter le début de la légende."},
{t:"Mémoire des Grands Fleuves",a:"Paul-Henri Mbarga",g:"Histoire",c:"#1c4a4a",w:62,h:208,p:8000,d:"De la source à l'estuaire, l'histoire de ceux qui vivent sur les rives.",x:"Avant les routes, il y avait les fleuves. Ils portaient les pirogues, les nouvelles, les mariages et parfois les guerres.|Ce livre suit leur cours de la source à l'estuaire et écoute ceux qui vivent sur leurs rives depuis toujours."},
{t:"L'Horloger de Minuit",a:"Camille Rousseau",g:"Roman",c:"#4a2340",w:44,h:188,p:4500,d:"L'horloge de la gare s'arrête chaque nuit à minuit. Pourquoi ?",x:"L'horloge de la gare s'arrêtait chaque nuit à minuit précis, et personne ne s'en étonnait plus, sauf le nouveau chef de gare.|Il monta au clocher avec une lampe, un tournevis et la ferme intention de comprendre. Il y trouva un vieil homme qui remontait le temps."},
{t:"Petit Atlas des Étoiles",a:"Léa Fontaine",g:"Sciences",c:"#1d2b4a",w:52,h:200,p:7500,d:"Un guide de poche pour reconnaître les constellations à l'œil nu.",x:"Levez les yeux : ces points de lumière sont des soleils lointains. Le plus proche, après le nôtre, est à plus de quatre années-lumière.|Pour les repérer, il suffit d'un ciel dégagé, d'un peu de patience et de ce petit atlas glissé dans la poche."},
{t:"Le Jardin des Contes Perdus",a:"Fatou Ndiaye",g:"Jeunesse",c:"#7a3418",w:60,h:212,p:3500,d:"Dans le jardin de grand-mère, chaque conte oublié devient une fleur.",x:"Dans le jardin de grand-mère, chaque conte oublié devenait une fleur. Il suffisait de tendre l'oreille pour l'entendre éclore.|Un soir, Kofi trouva un bouton qui chantait. Il décida de l'arroser avec de l'eau de pluie et beaucoup de curiosité."},
{t:"Carnets de Route",a:"Marc Olivier",g:"Voyage",c:"#4b4a1e",w:46,h:192,p:6000,d:"Trois semaines sur les routes, un carnet, et aucun plan précis.",x:"Nous avons quitté la ville à l'aube, sans autre plan que celui de suivre la route tant qu'elle nous paraîtrait belle.|Au troisième jour, le carnet était plein de noms de villages, de recettes griffonnées et d'adresses de gens qui nous avaient nourris."},
{t:"Éloge de la Lenteur",a:"Étienne Vasseur",g:"Essai",c:"#1a1a1a",w:50,h:204,p:5500,d:"Un essai pour reprendre le temps de lire, de marcher et de penser.",x:"Nous avons tout accéléré, jusqu'à nos pensées. Pourtant, la lecture reste ce petit territoire où l'on peut encore marcher lentement.|Prendre son temps n'est pas perdre son temps : c'est en retrouver la texture, page après page, comme on caresse le grain du papier."}
];
const $=s=>document.querySelector(s),nz=s=>s.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'');
const pal=["#5b1a1f","#1f3d2e","#1d2b4a","#3e2a1c","#1c4a4a","#4a2340","#4b4a1e","#1a1a1a","#7a3418"];
const S=[1,4,8,14];
const rm=matchMedia('(prefers-reduced-motion: reduce)').matches;
addEventListener('pointermove',e=>{document.documentElement.style.setProperty('--mx',e.clientX+'px');document.documentElement.style.setProperty('--my',e.clientY+'px')},{passive:true});
let cur=null,pg=0,cat='Tout',last=null,cart=[],tm;

const sp=i=>{const b=B[i];return `<button class="spine" data-i="${i}" style="--c:${b.c};--w:${b.w}px;--h:${b.h}px" aria-label="${b.t}, ${b.a}"><span>${b.t}</span></button>`};
const fill=k=>{const r=(k*7919)%97;return `<i class="spine" aria-hidden="true" style="--c:${pal[r%9]};--w:${26+r%22}px;--h:${150+(r*3)%70}px;pointer-events:none"></i>`};
const ladderSvg=`<svg viewBox="0 0 60 260" preserveAspectRatio="none" aria-hidden="true"><defs><linearGradient id="lw" x1="0" x2="1"><stop offset="0" stop-color="#6b4423"/><stop offset=".5" stop-color="#9a6a35"/><stop offset="1" stop-color="#5a3a1c"/></linearGradient></defs><circle cx="30" cy="9" r="8" fill="#241608"/><rect x="4" y="12" width="9" height="246" rx="3" fill="url(#lw)"/><rect x="47" y="12" width="9" height="246" rx="3" fill="url(#lw)"/><g stroke="#7a4a22" stroke-width="7" stroke-linecap="round"><line x1="9" y1="40" x2="51" y2="40"/><line x1="9" y1="78" x2="51" y2="78"/><line x1="9" y1="116" x2="51" y2="116"/><line x1="9" y1="154" x2="51" y2="154"/><line x1="9" y1="192" x2="51" y2="192"/><line x1="9" y1="230" x2="51" y2="230"/></g></svg>`;
$('#rows').innerHTML=[0,4].map(s=>`<div class="relative">${s?'':`<div class="rail" aria-hidden="true"></div><button id="ladder" type="button" aria-label="Faire glisser l'échelle le long du rayon" class="ladder-wrap" style="left:14%">${ladderSvg}</button>`}<div class="shelf">${Array.from({length:20},(_,j)=>S.includes(j)?sp(s+S.indexOf(j)):fill(s*20+j)).join('')}</div><div class="plank"></div></div>`).join('');
(function(){const lw=$('#ladder');if(!lw)return;const wrap=lw.parentElement;let sx=0,sl=0,drag=false;const cl=v=>Math.min(90,Math.max(4,v));
lw.onpointerdown=e=>{drag=true;lw.setPointerCapture(e.pointerId);sx=e.clientX;sl=parseFloat(lw.style.left);lw.style.transition='none'};
lw.onpointermove=e=>{if(!drag)return;const r=wrap.getBoundingClientRect(),dx=e.clientX-sx;lw.style.left=cl(sl+dx/r.width*100)+'%';if(!rm)lw.style.transform=`rotate(${Math.max(-5,Math.min(5,dx/9))}deg)`};
const end=()=>{if(!drag)return;drag=false;lw.style.transition='';lw.style.transform=''};
lw.onpointerup=end;lw.onpointercancel=end;
lw.onkeydown=e=>{const v=parseFloat(lw.style.left);if(e.key=='ArrowLeft')lw.style.left=cl(v-6)+'%';if(e.key=='ArrowRight')lw.style.left=cl(v+6)+'%'};
})();
$('#cats').innerHTML=['Tout',...new Set(B.map(b=>b.g))].map(c=>`<button class="plate px-4 py-1 text-lg" aria-pressed="${c=='Tout'}">${c}</button>`).join('');

const filt=()=>{const q=nz($('#q').value.trim());let k=0;document.querySelectorAll('button.spine').forEach(e=>{const b=B[e.dataset.i],ok=(cat=='Tout'||b.g==cat)&&(!q||nz(b.t+b.a+b.g+b.d).includes(q));e.classList.toggle('dim',!ok);if(ok)k++});$('#ct').textContent=k?`${k} ouvrage${k>1?'s':''} sur les rayons`:'Aucun ouvrage ne correspond : essayez un autre mot.'};
$('#q').oninput=filt;
$('#cats').onclick=e=>{const c=e.target.closest('button');if(!c)return;cat=c.textContent;document.querySelectorAll('#cats button').forEach(x=>x.setAttribute('aria-pressed',x==c));filt()};
$('#rows').onclick=e=>{const s=e.target.closest('button.spine');if(s)openBook(+s.dataset.i,s)};

function show(){const P=B[cur].x.split('|');$('#tx').textContent=P[pg];$('#pn').textContent=`${pg+1} / ${P.length}`;$('#pv').disabled=!pg;$('#nx').disabled=pg==P.length-1;$('#en').hidden=pg<P.length-1}
function openBook(i,el){const r0=el.getBoundingClientRect();cur=i;pg=0;last=el;const b=B[i],bk=$('#bk');bk.style.setProperty('--c',b.c);$('#bg').textContent=b.g;$('#bt').textContent=b.t;$('#ba').textContent='de '+b.a;$('#bd').textContent=b.d;$('#bp').textContent=b.p.toLocaleString('fr-FR');$('#m').classList.replace('hidden','flex');document.body.style.overflow='hidden';if(!rm){const r1=bk.getBoundingClientRect(),dx=(r0.left+r0.width/2)-(r1.left+r1.width/2),dy=(r0.top+r0.height/2)-(r1.top+r1.height/2),sx=Math.max(r0.width/r1.width,.06),sy=Math.max(r0.height/r1.height,.06);bk.style.transition='none';bk.style.transform=`perspective(1400px) translate(${dx}px,${dy}px) scale(${sx},${sy}) rotateY(-65deg)`;bk.style.opacity='.35';requestAnimationFrame(()=>{bk.style.transition='transform .55s cubic-bezier(.22,.8,.2,1),opacity .4s';bk.style.transform='';bk.style.opacity='1'})}show();$('#x').focus()}
const cls=()=>{$('#m').classList.replace('flex','hidden');document.body.style.overflow='';cur=null;if(last)last.focus()};
function go(d){const L=B[cur].x.split('|').length;if(pg+d<0||pg+d>=L)return;const r=$('#rp');r.classList.remove('flip');void r.offsetWidth;r.classList.add('flip');setTimeout(()=>{pg+=d;show()},220)}
$('#x').onclick=cls;$('#m').onclick=e=>{if(e.target.id=='m')cls()};
$('#pv').onclick=()=>go(-1);$('#nx').onclick=()=>go(1);
addEventListener('keydown',e=>{if(cur===null)return;if(e.key=='Escape')cls();if(e.key=='ArrowRight')go(1);if(e.key=='ArrowLeft')go(-1)});

const toast=s=>{const t=$('#t');t.textContent=s;t.classList.add('on');clearTimeout(tm);tm=setTimeout(()=>t.classList.remove('on'),2400)};
$('#add').onclick=()=>{cart.push(B[cur]);$('#n').textContent=cart.length;const c=$('#cart');c.classList.remove('stamp');void c.offsetWidth;c.classList.add('stamp');toast(`« ${B[cur].t} » est sur le comptoir`)};
$('#cart').onclick=()=>toast(cart.length?`${cart.length} livre${cart.length>1?'s':''} : ${cart.reduce((s,b)=>s+b.p,0).toLocaleString('fr-FR')} FCFA`:'Le comptoir est vide pour l\u2019instant.');
filt();
</script>
</body>
</html>
