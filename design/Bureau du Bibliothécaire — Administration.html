<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Bureau du Bibliothécaire — Administration</title>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=Cormorant+Garamond:ital,wght@0,500;0,700;1,500&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script>
<script>tailwind.config={theme:{extend:{fontFamily:{cinzel:['Cinzel','Georgia','serif'],garamond:['Cormorant Garamond','Georgia','serif']}}}}</script>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;min-height:100%;color:#f3e7cc;font-family:'Cormorant Garamond',Georgia,serif;background:#1b1209;background-image:radial-gradient(ellipse 900px 500px at 50% -10%,#2f2011,transparent),linear-gradient(#17100a,#120c06)}
:focus-visible{outline:2px solid #f3d98b;outline-offset:2px}
.plate{background:linear-gradient(135deg,#f3d98b,#b98a2e 50%,#8a6420);color:#2a190e;font-family:'Cormorant Garamond',Georgia,serif;font-weight:700;border:1px solid #6b4a12;border-radius:3px;box-shadow:0 2px 4px #000a,inset 0 1px 0 #fff8;cursor:pointer}
.plate:hover{filter:brightness(1.08)}
.card2{background:linear-gradient(#271a0d,#1e1409);border:1px solid #4a2c17;border-radius:6px;box-shadow:0 6px 14px #0007}
.ledger{background:repeating-linear-gradient(#f7edd4 0 41px,#c7a96f66 41px 42px)}
.ledger th{font-family:Cinzel,Georgia,serif;font-size:.68rem;letter-spacing:.07em;text-transform:uppercase;color:#8b1e1e;border-bottom:2px solid #8b1e1e55;padding:10px 14px;text-align:left;background:#f7edd4}
.ledger td{padding:9px 14px;color:#3b2a1a;border-bottom:1px solid #0000000f}
.ledger tr:last-child td{border-bottom:0}
input,select,textarea{background:#fffaf0;color:#2a190e;border:1px solid #c7a96f;border-radius:3px;padding:.45rem .7rem;font-family:'Cormorant Garamond',Georgia,serif;font-size:1.05rem;width:100%}
input:focus,select:focus,textarea:focus{outline:2px solid #8b1e1ea0;outline-offset:1px}
label span{display:block;font-size:.8rem;color:#e9c96b;margin-bottom:.2rem}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body class="px-3 pb-16 pt-6 sm:px-6">
<header class="mx-auto max-w-5xl">
  <div class="flex flex-wrap items-center justify-between gap-3">
    <div>
      <p class="font-garamond text-sm italic text-[#e9c96b]/70">La Bibliothèque des Mots</p>
      <h1 class="font-cinzel text-2xl font-bold sm:text-3xl">Bureau du Bibliothécaire</h1>
    </div>
    <a href="https://claude.ai/artifact/XZ3EdsHgJ2cZgAUf4ze3bH" class="font-garamond text-base italic text-[#e9c96b]/80 underline">← Retour à la boutique</a>
  </div>
  <div id="stats" class="mt-6 grid grid-cols-2 gap-3 sm:grid-cols-4"></div>
</header>

<main class="mx-auto mt-8 max-w-5xl">
  <div class="flex flex-wrap items-center gap-3">
    <input id="q" type="search" placeholder="Rechercher un titre, un auteur…" class="min-w-[200px] flex-1">
    <select id="catf" class="w-auto"></select>
    <button id="new" class="plate whitespace-nowrap px-4 py-2 text-lg">+ Nouvel ouvrage</button>
  </div>
  <p id="cnt" class="mt-2 font-garamond text-sm italic text-[#e9c96b]/70"></p>

  <div class="card2 mt-3 overflow-x-auto">
    <table class="ledger w-full min-w-[680px] text-left font-garamond text-base">
      <thead><tr><th>Titre</th><th>Auteur</th><th>Catégorie</th><th>Prix</th><th>Stock</th><th>Actions</th></tr></thead>
      <tbody id="tbody"></tbody>
    </table>
  </div>
</main>

<div id="m" class="fixed inset-0 z-50 hidden items-center justify-center bg-black/70 p-3 backdrop-blur-sm" role="dialog" aria-modal="true" aria-labelledby="mt">
  <form id="frm" class="card2 w-full max-w-lg p-6 sm:p-8">
    <h2 id="mt" class="font-cinzel text-xl text-[#e9c96b]">Nouvel ouvrage</h2>
    <div class="mt-4 grid gap-3 sm:grid-cols-2">
      <label class="sm:col-span-2"><span>Titre</span><input id="f_t" required></label>
      <label><span>Auteur</span><input id="f_a" required></label>
      <label><span>Catégorie</span><select id="f_g"></select></label>
      <label><span>Prix (FCFA)</span><input id="f_p" type="number" min="0" required></label>
      <label><span>Stock</span><input id="f_s" type="number" min="0" required></label>
      <label class="sm:col-span-2"><span>Description</span><textarea id="f_d" rows="2"></textarea></label>
    </div>
    <div class="mt-5 flex justify-end gap-4">
      <button type="button" id="cancel" class="font-garamond text-lg italic underline">Annuler</button>
      <button type="submit" class="plate px-5 py-2 text-lg">Enregistrer</button>
    </div>
  </form>
</div>

<div id="t" role="status" class="plate pointer-events-none fixed left-1/2 z-[60] max-w-[92vw] -translate-x-1/2 px-5 py-2 text-center text-lg opacity-0 transition-opacity" style="bottom:calc(1.5rem + env(safe-area-inset-bottom,0px))"></div>

<script>
const $=s=>document.querySelector(s),fmt=n=>n.toLocaleString('fr-FR');
const CATS=['Roman','Histoire','Sciences','Jeunesse','Voyage','Essai'];
let BOOKS=[
{id:1,t:"Le Cartographe des Brumes",a:"Élise Marchand",g:"Roman",p:6500,s:12,d:"Un géomètre dessine la carte d'une île qui change de place chaque matin."},
{id:2,t:"Nuits d'Harmattan",a:"Awa Diallo",g:"Roman",p:5000,s:7,d:"Quand le vent sec se lève, une ville entière rouvre ses souvenirs."},
{id:3,t:"Mémoire des Grands Fleuves",a:"Paul-Henri Mbarga",g:"Histoire",p:8000,s:4,d:"De la source à l'estuaire, l'histoire de ceux qui vivent sur les rives."},
{id:4,t:"L'Horloger de Minuit",a:"Camille Rousseau",g:"Roman",p:4500,s:0,d:"L'horloge de la gare s'arrête chaque nuit à minuit. Pourquoi ?"},
{id:5,t:"Petit Atlas des Étoiles",a:"Léa Fontaine",g:"Sciences",p:7500,s:15,d:"Un guide de poche pour reconnaître les constellations à l'œil nu."},
{id:6,t:"Le Jardin des Contes Perdus",a:"Fatou Ndiaye",g:"Jeunesse",p:3500,s:22,d:"Dans le jardin de grand-mère, chaque conte oublié devient une fleur."},
{id:7,t:"Carnets de Route",a:"Marc Olivier",g:"Voyage",p:6000,s:3,d:"Trois semaines sur les routes, un carnet, et aucun plan précis."},
{id:8,t:"Éloge de la Lenteur",a:"Étienne Vasseur",g:"Essai",p:5500,s:9,d:"Un essai pour reprendre le temps de lire, de marcher et de penser."}
];
let nextId=9,editId=null,tm;

function stats(){
  const val=BOOKS.reduce((s,b)=>s+b.p*b.s,0),ex=BOOKS.reduce((s,b)=>s+b.s,0),rupture=BOOKS.filter(b=>b.s==0).length;
  $('#stats').innerHTML=`<div class="card2 p-4"><p class="text-sm text-[#e9c96b]/70">Ouvrages au catalogue</p><p class="font-cinzel text-3xl mt-1">${BOOKS.length}</p></div><div class="card2 p-4"><p class="text-sm text-[#e9c96b]/70">Valeur du stock</p><p class="font-cinzel text-3xl mt-1">${fmt(val)} <small class="text-sm">FCFA</small></p></div><div class="card2 p-4"><p class="text-sm text-[#e9c96b]/70">Exemplaires en stock</p><p class="font-cinzel text-3xl mt-1">${ex}</p></div><div class="card2 p-4"><p class="text-sm text-[#e9c96b]/70">En rupture</p><p class="font-cinzel text-3xl mt-1 ${rupture?'text-[#e05a3f]':''}">${rupture}</p></div>`;
}
function rows(){
  const q=$('#q').value.trim().toLowerCase(),cat=$('#catf').value,list=BOOKS.filter(b=>(cat=='Tout'||b.g==cat)&&(!q||(b.t+' '+b.a).toLowerCase().includes(q)));
  $('#tbody').innerHTML=list.length?list.map(b=>`<tr><td class="font-semibold">${b.t}</td><td>${b.a}</td><td>${b.g}</td><td>${fmt(b.p)} FCFA</td><td class="${b.s==0?'font-bold text-[#8b1e1e]':''}">${b.s}</td><td class="whitespace-nowrap"><button class="underline" onclick="edit(${b.id})">Modifier</button> · <button class="text-[#8b1e1e] underline" onclick="del(${b.id})">Supprimer</button></td></tr>`).join(''):'<tr><td colspan="6" class="py-10 text-center italic">Aucun ouvrage ne correspond à cette recherche.</td></tr>';
  $('#cnt').textContent=`${list.length} ouvrage${list.length>1?'s':''} affiché${list.length>1?'s':''} sur ${BOOKS.length}`;
}
function refresh(){stats();rows()}
function openForm(){$('#m').classList.replace('hidden','flex')}
function closeForm(){$('#m').classList.replace('flex','hidden')}
function openNew(){editId=null;$('#mt').textContent='Nouvel ouvrage';$('#frm').reset();openForm()}
function edit(id){const b=BOOKS.find(x=>x.id==id);editId=id;$('#mt').textContent="Modifier l'ouvrage";$('#f_t').value=b.t;$('#f_a').value=b.a;$('#f_g').value=b.g;$('#f_p').value=b.p;$('#f_s').value=b.s;$('#f_d').value=b.d;openForm()}
function del(id){const b=BOOKS.find(x=>x.id==id);if(!confirm(`Retirer « ${b.t} » du catalogue ?`))return;BOOKS=BOOKS.filter(x=>x.id!=id);refresh();toast('Ouvrage retiré du catalogue')}
function toast(s){const e=$('#t');e.textContent=s;e.classList.remove('opacity-0');clearTimeout(tm);tm=setTimeout(()=>e.classList.add('opacity-0'),2200)}

$('#f_g').innerHTML=CATS.map(c=>`<option>${c}</option>`).join('');
$('#catf').innerHTML='<option>Tout</option>'+CATS.map(c=>`<option>${c}</option>`).join('');
$('#q').oninput=rows;$('#catf').onchange=rows;
$('#new').onclick=openNew;$('#cancel').onclick=closeForm;
$('#m').onclick=e=>{if(e.target.id=='m')closeForm()};
addEventListener('keydown',e=>{if(e.key=='Escape'&&!$('#m').classList.contains('hidden'))closeForm()});
$('#frm').onsubmit=e=>{e.preventDefault();const o={t:$('#f_t').value.trim(),a:$('#f_a').value.trim(),g:$('#f_g').value,p:+$('#f_p').value,s:+$('#f_s').value,d:$('#f_d').value.trim()};if(editId){Object.assign(BOOKS.find(x=>x.id==editId),o)}else{BOOKS.push({id:nextId++,...o})}closeForm();refresh();toast(editId?'Modifications enregistrées':'Ouvrage ajouté au catalogue')};
refresh();
</script>
</body>
</html>
